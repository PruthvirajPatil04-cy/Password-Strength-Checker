<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <meta name="description" content="Create strong and secure passwords instantly">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1>Password Generator</h1>
                <p>Create unbreakable passwords from your keywords</p>
            </div>
            <div class="generator-group">
                <p class="generator-label">Generate with keywords (Name, DOB, etc.)</p>
                <div class="generator-inputs">
                    <input type="text" id="keyword-input" placeholder="e.g. John, 1990" autocomplete="off">
                    <button type="button" id="generate-btn" class="primary-btn">
                        <i class="fas fa-magic"></i> Generate
                    </button>
                </div>
            </div>

            <div class="input-group">
                <input type="password" id="password-input" placeholder="Type your password..." autocomplete="off">
                <button type="button" id="toggle-password" aria-label="Toggle Password Visibility">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="strength-meter">
                <div class="bars">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div class="strength-text" id="strength-text">Enter keyword</div>
            </div>

            <div class="requirements">
                <div class="req-item" id="req-length">
                    <i class="fas fa-circle"></i> At least 8 characters
                </div>
                <div class="req-item" id="req-lower">
                    <i class="fas fa-circle"></i> Lowercase letter
                </div>
                <div class="req-item" id="req-upper">
                    <i class="fas fa-circle"></i> Uppercase letter
                </div>
                <div class="req-item" id="req-number">
                    <i class="fas fa-circle"></i> Number
                </div>
                <div class="req-item" id="req-special">
                    <i class="fas fa-circle"></i> Special character
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
